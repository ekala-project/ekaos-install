name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
    - name: Build
      run: nix develop --command cargo build --verbose
    - name: Run tests
      run: nix develop --command cargo test --verbose
    - name: Run clippy
      run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
    - name: Check Rust formatting
      run: nix develop --command cargo fmt --all --check --verbose
